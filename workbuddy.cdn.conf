# ============================================================
# WorkBuddy 令牌捕获 —— Quantumult X 远程重写订阅（jsDelivr CDN 版）
# 适合国内网络：订阅与脚本全部走 cdn.jsdelivr.net
# 首次捕获成功后建议停用本订阅，只保留每日签到定时任务。
# 脚本会在 QX 日志中输出 [WorkBuddyCapture] 前缀，便于排查。
# ============================================================

[rewrite_local]
# 1) 刷新令牌接口【请求头】：抓取 X-Refresh-Token
https:\/\/copilot\.tencent\.com\/v2\/plugin\/auth\/token\/refresh url script-request-header https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js

# 2) 域名族下的所有 JSON 响应【响应体】：字段名 + Offline 特征 + 字符串正则三提取
^https:\/\/copilot\.tencent\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js
^https:\/\/[a-z.]*workbuddy\.(cn|com)\/ url script-response-body https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js
^https:\/\/[a-z.]*codebuddy\.(cn|com)\/ url script-response-body https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js
# 微信扫码/公众号登录会回跳到腾讯身份认证域名，token 在这些域名的响应里签发
^https:\/\/[a-z.]*cloud\.tencent\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js
^https:\/\/[a-z.]*myqcloud\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js
^https:\/\/open\.weixin\.qq\.com\/ url script-response-body https://cdn.jsdelivr.net/gh/roamout/workbuddy-qx@main/workbuddy_capture_token.js

[mitm]
hostname = copilot.tencent.com, *.workbuddy.cn, *.workbuddy.com, *.codebuddy.cn, *.codebuddy.com, *.cloud.tencent.com, *.myqcloud.com, open.weixin.qq.com
