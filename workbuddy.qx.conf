# ============================================================
# WorkBuddy 令牌捕获 —— Quantumult X 远程重写订阅
# 首次捕获成功后建议停用本订阅，只保留每日签到定时任务；
# 忘记停用也无妨，令牌相同会静默，轮换时自动同步最新值。
# ============================================================

[rewrite_local]
# 1) 刷新令牌接口【请求头】：抓取 X-Refresh-Token（兜底，App 自动刷新时即可命中）
https:\/\/copilot\.tencent\.com\/v2\/plugin\/auth\/token\/refresh url script-request-header https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js

# 2) 令牌网关【响应体】：抓取登录/刷新响应里轮换出的新 refreshToken（最准）
^https:\/\/copilot\.tencent\.com\/v2\/plugin\/auth\/ url script-response-body https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js

# 3) App / 小程序登录接口【响应体】：Keycloak 风格登录响应里的 refresh_token
^https:\/\/[a-z.]*workbuddy\.(cn|com)\/auth\/ url script-response-body https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js
^https:\/\/[a-z.]*codebuddy\.(cn|com)\/auth\/ url script-response-body https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js

[mitm]
hostname = copilot.tencent.com, *.workbuddy.cn, *.workbuddy.com, *.codebuddy.cn, *.codebuddy.com
