# ============================================================
# WorkBuddy 令牌捕获 —— Quantumult X 远程重写订阅
# 首次捕获成功后建议停用本订阅，只保留每日签到定时任务；
# 忘记停用也无妨，令牌相同会静默，轮换时自动同步最新值。
# 脚本会在 QX 日志中输出 [WorkBuddyCapture] 前缀，便于排查。
# ============================================================

[rewrite_local]
# 1) 刷新令牌接口【请求头】：抓取 X-Refresh-Token
https:\/\/copilot\.tencent\.com\/v2\/plugin\/auth\/token\/refresh url script-request-header https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js

# 2) 三个域名族下的所有 JSON 响应【响应体】：字段名 + Offline 特征双提取
#    覆盖 App / 小程序 / 网关的登录、刷新、鉴权等全部路径
^https:\/\/copilot\.tencent\.com\/ url script-response-body https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js
^https:\/\/[a-z.]*workbuddy\.(cn|com)\/ url script-response-body https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js
^https:\/\/[a-z.]*codebuddy\.(cn|com)\/ url script-response-body https://raw.githubusercontent.com/roamout/workbuddy-qx/main/workbuddy_capture_token.js

[mitm]
hostname = copilot.tencent.com, *.workbuddy.cn, *.workbuddy.com, *.codebuddy.cn, *.codebuddy.com
